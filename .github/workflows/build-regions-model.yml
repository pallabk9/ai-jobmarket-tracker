name: Regional occupation models (O*NET via ISCO)

on:
  schedule:
    # Quarterly, staggered a day after the US build
    - cron: "0 7 2 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-regions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Build EU / IN / AU / APAC from O*NET via ISCO
        env:
          ONET_VER: db_30_3
        run: |
          for R in EU IN AU APAC; do
            echo "::group::$R"
            python model/regional_build/build_region_from_onet.py "$R" \
              || echo "::warning::$R skipped - populate isco/soc_isco_crosswalk.csv and isco/${R}_employment.csv (see model/regional_build/isco/README.md)"
            echo "::endgroup::"
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*_occupations.json data/current.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): rebuild regional occupation models $(date -u +'%Y-%m-%d')"
            git push
          fi
