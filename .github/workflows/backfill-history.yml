name: One-time history backfill (real sources)

# Manual trigger only. Replaces synthetic W10+ history with real data
# from Hiring Lab / BLS / ONS / Eurostat / ABS / Challenger anchors,
# then commits. Safe to re-run; it overwrites the same wired pairs.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run backfill
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python scripts/backfill_real_history.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: backfill real history for wired KPIs $(date -u +'%Y-%m-%d')"
            git push
          fi
