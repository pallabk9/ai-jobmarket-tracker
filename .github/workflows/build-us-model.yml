name: US occupation model (O*NET + BLS)

on:
  schedule:
    # Quarterly: 1st of Jan, Apr, Jul, Oct at 07:00 UTC (after O*NET / OES refreshes)
    - cron: "0 7 1 1,4,7,10 *"
  workflow_dispatch:  # run manually from the Actions tab whenever sources update

permissions:
  contents: write

jobs:
  build-us:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Build US model from O*NET + BLS OES
        env:
          # bump when O*NET ships a new database, or when the BLS OES year rolls over
          ONET_VER: db_30_3
          BLS_OES_ZIP: https://www.bls.gov/oes/special-requests/oesm23nat.zip
        run: python model/regional_build/us/build_us_from_onet.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us_occupations.json data/current.json model/regional_build/regions/US_occupations.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): rebuild US occupation model $(date -u +'%Y-%m-%d')"
            git push
          fi
