name: Weekly data refresh

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:  # also allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab

      - name: Refresh weekly data
        run: python scripts/update_data.py

      - name: Rebuild user manual (in case methodology was updated)
        run: python scripts/build_manual.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ manual.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): weekly refresh $(date -u +'%Y-%m-%d')"
            git push
          fi
